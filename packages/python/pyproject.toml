[project]
name = "agent-custody"
version = "0.16.2"
description = "Proof of what your AI agents did. Give your agents real power, without losing control of them. The Python client of the agent-custody sidecar."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-custody-verify = "agent_custody.verify:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.1"]
crewai = ["crewai>=1.0"]
memory = ["mcp>=1.0"]
verify = ["cryptography>=42"]
adk = ["google-adk[a2a]>=2.0"]
test = ["pytest>=8", "cryptography>=42", "langchain-core>=0.3", "openai-agents>=0.1", "crewai>=1.0", "mcp>=1.0", "google-adk[a2a]>=2.0", "pytest-cov==6.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_custody"]

[tool.pytest.ini_options]
testpaths = ["tests"]
